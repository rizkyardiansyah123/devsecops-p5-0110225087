name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan unit test + coverage (Quality Gate coverage minimal 80%)
        run: pytest --cov=src/stokku --cov-report=term-missing --cov-fail-under=80

  sast-scan:
    name: SAST Scan (Bandit) dan Quality Gate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit==1.7.10

      - name: Jalankan Bandit (laporan JSON, tidak menggagalkan job)
        run: bandit -r src -f json -o bandit-report.json --exit-zero

      - name: Upload laporan Bandit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Quality Gate - gagal jika ada temuan severity MEDIUM atau HIGH
        run: bandit -r src -ll